<svg xmlns="http://www.w3.org/2000/svg" width="3100" height="1900" viewBox="0 0 3100 1900">
<defs><filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-opacity=".12"/></filter><style>.t{font-family:Inter,Arial,sans-serif;fill:#152038}.muted{fill:#7A8192}.card{fill:#fff}.p{fill:#4F6BFF}.mint{fill:#18B88B}.bg{fill:#F6F7FB}.h1{font-size:34px;font-weight:800}.h2{font-size:22px;font-weight:750}.b{font-size:15px}.s{font-size:12px}</style></defs>
<rect width="3100" height="1900" fill="#EDEFF5"/>
<text x="80" y="80" class="t h1">DocuScan — Figma Import Board</text><text x="80" y="115" class="muted b">Import this SVG into Figma, then ungroup frames to edit.</text>
<!-- Home -->
<g transform="translate(80,170)" filter="url(#sh)"><rect width="390" height="844" rx="34" class="bg"/><text x="24" y="55" class="t h1">DocuScan</text><text x="24" y="82" class="muted b">Private. Local. Searchable.</text><rect x="24" y="105" width="342" height="54" rx="16" class="card"/><text x="58" y="138" class="muted b">Search titles, tags, or text…</text><rect x="24" y="181" width="342" height="148" rx="24" class="p"/><text x="46" y="226" fill="white" class="h2">Scan a document</text><text x="46" y="255" fill="#DCE2FF" class="b">Auto enhance + on-device OCR</text><circle cx="320" cy="284" r="30" fill="#fff" opacity=".2"/><text x="311" y="293" fill="white" font-size="28">+</text><text x="24" y="375" class="t h2">Recent documents</text><g transform="translate(24,398)"><rect width="342" height="112" rx="20" class="card"/><rect x="12" y="12" width="74" height="88" rx="14" fill="#E7EAF2"/><text x="104" y="42" class="t b" font-weight="700">Rental Agreement</text><text x="104" y="68" class="muted s">3 pages • OCR indexed</text><text x="104" y="89" class="muted s">tenant agrees to the following…</text></g><g transform="translate(24,522)"><rect width="342" height="112" rx="20" class="card"/><rect x="12" y="12" width="74" height="88" rx="14" fill="#E7EAF2"/><text x="104" y="42" class="t b" font-weight="700">Receipt — Office Supplies</text><text x="104" y="68" class="muted s">1 page • OCR indexed</text></g><circle cx="195" cy="775" r="36" class="p"/><text x="178" y="783" fill="white" font-size="26">▣</text></g>
<!-- Scanner -->
<g transform="translate(520,170)" filter="url(#sh)"><rect width="390" height="844" rx="34" fill="#0A0D13"/><text x="24" y="55" fill="white" class="h2">1 page</text><text x="322" y="55" fill="#9FB0FF" class="b">Done</text><rect x="28" y="126" width="334" height="520" rx="24" fill="#242A34"/><path d="M55 170 H95 M55 170 V210 M335 170 H295 M335 170 V210 M55 602 H95 M55 602 V562 M335 602 H295 M335 602 V562" stroke="#67E1B5" stroke-width="4" fill="none"/><rect x="73" y="195" width="245" height="365" rx="5" fill="#F8F4E9" transform="rotate(-2 195 377)"/><line x1="100" y1="260" x2="290" y2="260" stroke="#B6B1A6"/><line x1="100" y1="290" x2="275" y2="290" stroke="#CAC5BA"/><line x1="100" y1="320" x2="290" y2="320" stroke="#CAC5BA"/><circle cx="195" cy="742" r="43" fill="none" stroke="white" stroke-width="5"/><circle cx="195" cy="742" r="32" fill="white"/><text x="24" y="804" fill="#9AA3B2" class="s">AUTO • edges detected • hold steady</text></g>
<!-- Crop -->
<g transform="translate(960,170)" filter="url(#sh)"><rect width="390" height="844" rx="34" fill="#121722"/><text x="24" y="55" fill="white" class="h2">Adjust edges</text><rect x="28" y="110" width="334" height="520" rx="18" fill="#2C3440"/><polygon points="65,155 330,140 342,592 50,605" fill="#F5F1E7" stroke="#67E1B5" stroke-width="3"/><g fill="#67E1B5"><circle cx="65" cy="155" r="9"/><circle cx="330" cy="140" r="9"/><circle cx="342" cy="592" r="9"/><circle cx="50" cy="605" r="9"/></g><rect x="24" y="680" width="104" height="48" rx="15" fill="#2B3340"/><text x="48" y="710" fill="white" class="b">Rotate</text><rect x="143" y="680" width="104" height="48" rx="15" fill="#2B3340"/><text x="165" y="710" fill="white" class="b">Reset</text><rect x="262" y="680" width="104" height="48" rx="15" class="p"/><text x="285" y="710" fill="white" class="b">Apply</text></g>
<!-- Enhance -->
<g transform="translate(1400,170)" filter="url(#sh)"><rect width="390" height="844" rx="34" class="bg"/><text x="24" y="55" class="t h2">Enhance</text><rect x="24" y="95" width="342" height="510" rx="20" fill="#E6E1D4"/><rect x="63" y="132" width="264" height="430" rx="6" fill="white"/><line x1="90" y1="210" x2="295" y2="210" stroke="#454A54"/><line x1="90" y1="245" x2="270" y2="245" stroke="#737986"/><line x1="90" y1="280" x2="295" y2="280" stroke="#737986"/><text x="24" y="648" class="t h2">Filter</text><g transform="translate(24,672)"><rect width="98" height="78" rx="18" fill="#E8EBF5"/><text x="23" y="47" class="t b">Original</text><rect x="111" width="98" height="78" rx="18" fill="#E8EBF5"/><text x="127" y="47" class="t b">Gray</text><rect x="222" width="120" height="78" rx="18" fill="#DDE3FF" stroke="#4F6BFF"/><text x="244" y="47" class="t b" font-weight="700">Document</text></g></g>
<!-- Detail -->
<g transform="translate(1840,170)" filter="url(#sh)"><rect width="390" height="844" rx="34" class="bg"/><text x="24" y="55" class="t h2">Rental Agreement</text><rect x="24" y="90" width="342" height="420" rx="20" fill="#E4E7EE"/><rect x="67" y="116" width="255" height="370" rx="5" fill="white"/><text x="24" y="555" class="t h2">Recognized text</text><rect x="24" y="578" width="342" height="158" rx="20" class="card"/><text x="42" y="611" class="muted b">This rental agreement is made between…</text><text x="42" y="640" class="muted b">The tenant agrees to the following terms…</text><rect x="24" y="766" width="342" height="54" rx="16" class="p"/><text x="125" y="800" fill="white" class="b" font-weight="700">Preview / Export PDF</text></g>
<!-- Search -->
<g transform="translate(2280,170)" filter="url(#sh)"><rect width="390" height="844" rx="34" class="bg"/><text x="24" y="55" class="t h1">Search</text><rect x="24" y="90" width="342" height="54" rx="16" class="card"/><text x="52" y="123" class="t b">invoice</text><text x="24" y="184" class="muted b">3 matches in OCR text</text><g transform="translate(24,210)"><rect width="342" height="122" rx="20" class="card"/><text x="18" y="32" class="t b" font-weight="700">Invoice #44821</text><text x="18" y="61" class="muted s">…total invoice amount EGP 2,450.00…</text><rect x="18" y="78" width="68" height="24" rx="12" fill="#E0FAF2"/><text x="31" y="95" fill="#118664" class="s">invoice</text></g><g transform="translate(24,346)"><rect width="342" height="122" rx="20" class="card"/><text x="18" y="32" class="t b" font-weight="700">Vendor Statement</text><text x="18" y="61" class="muted s">…invoice date and payment reference…</text></g></g>
<text x="80" y="1100" class="t h2">Design tokens</text><rect x="80" y="1130" width="2590" height="530" rx="28" fill="white"/><g transform="translate(120,1180)"><text class="t h2">Colors</text><circle cx="20" cy="60" r="20" fill="#4F6BFF"/><text x="55" y="66" class="t b">Primary #4F6BFF</text><circle cx="20" cy="115" r="20" fill="#18B88B"/><text x="55" y="121" class="t b">Mint #18B88B</text><circle cx="20" cy="170" r="20" fill="#152038"/><text x="55" y="176" class="t b">Ink #152038</text><circle cx="20" cy="225" r="20" fill="#F6F7FB" stroke="#ddd"/><text x="55" y="231" class="t b">Canvas #F6F7FB</text></g><g transform="translate(520,1180)"><text class="t h2">Type scale</text><text y="60" class="t h1">Display 34 / 800</text><text y="112" class="t h2">Heading 22 / 750</text><text y="160" class="t b">Body 15 / regular</text><text y="205" class="muted s">Caption 12 / regular</text></g><g transform="translate(1000,1180)"><text class="t h2">Geometry</text><text y="60" class="t b">Screen radius: 34</text><text y="100" class="t b">Card radius: 20–24</text><text y="140" class="t b">Input radius: 16</text><text y="180" class="t b">Base spacing: 4 / 8 / 12 / 16 / 20 / 24 / 32</text><text y="220" class="t b">Touch target: ≥ 48</text></g><g transform="translate(1640,1180)"><text class="t h2">Components</text><text y="60" class="t b">Search field</text><text y="100" class="t b">Document card + thumbnail</text><text y="140" class="t b">Scan CTA</text><text y="180" class="t b">Camera corner guide</text><text y="220" class="t b">Crop handles</text><text y="260" class="t b">Filter chips</text><text y="300" class="t b">Privacy status chip</text></g></svg>