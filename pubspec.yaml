name: docuscan
description: Privacy-focused on-device document scanner portfolio app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.5.4
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  path: ^1.9.1
  pdf: ^3.13.0
  printing: ^5.14.2
  local_auth: ^3.0.2
  share_plus: ^12.0.0
  uuid: ^4.5.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
